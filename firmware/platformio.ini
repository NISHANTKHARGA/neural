; SAFETRAILS ESP32 firmware — PlatformIO.
; Three hardware builds share one codebase (src/) and three mains (src/app/).
; LoRa frequencies are REGION LOCKED — see src/config.h.

[platformio]
default_envs = relay

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@^7.4.0
    h2zero/NimBLE-Arduino@^2.2.0
build_flags =
    -Wall
    -Wno-unused-parameter
    ; 1 = errors only: surfaces "failed to send value, rc=... reason" from NimBLE,
    ; which is the only way to tell a too-small MTU from an unsubscribed client.
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DCORE_DEBUG_LEVEL=1

[env:relay]
build_flags = ${env.build_flags} -DST_NODE_ID="\"N-A\"" -DST_ROLE_GATEWAY=0 -DST_HAS_LORA=1
build_src_filter = +<*> -<app/gateway_main.cpp> -<app/demo_relay_main.cpp> -<web/*>

[env:gateway]
build_flags = ${env.build_flags} -DST_NODE_ID="\"RCUE\"" -DST_ROLE_GATEWAY=1 -DST_HAS_LORA=1
build_src_filter = +<*> -<app/relay_main.cpp> -<app/demo_relay_main.cpp>
lib_deps =
    jgromes/RadioLib@^7.4.0
    h2zero/NimBLE-Arduino@^2.2.0
    links2004/WebSockets@2.4.1
board_build.filesystem = littlefs

[env:demo_relay]
; BLE store-and-forward only (no LoRa). Use for BLE multi-hop demo without radio.
build_flags = ${env.build_flags} -DST_NODE_ID="\"N-B\"" -DST_ROLE_GATEWAY=0 -DST_HAS_LORA=0
build_src_filter = +<*> -<app/relay_main.cpp> -<app/gateway_main.cpp> -<web/*>

; ---------------------------------------------------------------
; Host-native unit tests for the protocol + router core.
; Run:  pio test -e test_native
[env:test_native]
platform = native
build_src_filter = +<core/*>
build_flags = -Isrc
test_framework = unity